# Non-voting Clang-Tidy static analysis check.
# Runs on PRs and main push but does NOT block merging (continue-on-error: true).
name: Clang-Tidy Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""

jobs:
  clang-tidy:
    name: Clang-Tidy Static Analysis
    runs-on: ubuntu-24.04
    continue-on-error: true  # non-voting: does not block PR merging

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: "clang-tidy"
          repository-cache: true

      - name: Allow linux-sandbox
        uses: ./actions/unblock_user_namespace_for_linux_sandbox

      - name: Run Clang-Tidy
        run: |
          bazel test --config=clang-tidy //...

      - name: Upload Clang-Tidy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-results
          path: bazel-testlogs/
          retention-days: 7
